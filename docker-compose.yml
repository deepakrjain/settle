services:
  db:
    image: postgres:15-alpine
    container_name: settle-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: settle_user
      POSTGRES_PASSWORD: settle_password
      POSTGRES_DB: settle_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settle_user -d settle_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: settle-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: settle_db
      DB_USER: settle_user
      DB_PASSWORD: settle_password
      JWT_SECRET: super-secret-production-key-must-be-at-least-256-bits-long
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
