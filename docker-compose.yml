version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: settle-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: settle_user
      POSTGRES_PASSWORD: settle_password
      POSTGRES_DB: settle_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
