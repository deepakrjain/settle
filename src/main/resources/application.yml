spring:
  application:
    name: settle
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:settle_db}
    username: ${DB_USER:settle_user}
    password: ${DB_PASSWORD:settle_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # We use Flyway for schema management
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:super-secret-key-for-dev-only-change-in-production-must-be-at-least-256-bits}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

payment:
  gateway:
    failure-rate-percent: ${PAYMENT_GATEWAY_FAILURE_RATE:20}

